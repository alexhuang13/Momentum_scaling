[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-scaling"
version = "0.2.0"
description = "Reproducible experiments for stochastic momentum scaling laws in power-law kernel regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "pandas>=2.0",
]
dev = [
  "black>=24.0",
]

[project.scripts]
momentum-scaling = "momentum_scaling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
