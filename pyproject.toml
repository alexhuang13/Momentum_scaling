[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-scaling"
version = "0.1.0"
description = "Reproducible experiments for stochastic momentum scaling laws in power-law kernel regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "matplotlib>=3.7",
]

[project.scripts]
momentum-scaling = "momentum_scaling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
