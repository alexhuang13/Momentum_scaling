[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-scaling"
version = "0.2.0"
description = "Four readable experiment groups for stochastic momentum scaling laws"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "pandas>=2.0",
]
dev = [
  "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_scaling", "loss", "blowup", "stability"]

[tool.black]
line-length = 88
target-version = ["py310"]
